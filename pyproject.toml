[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idsbench"
version = "1.0.0"
description = "A fair benchmark of machine-learning intrusion detectors on UNSW-NB15 and CIC-IDS2017: clean data, honest splits, error analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-xdist>=3.5",
  "ruff>=0.4",
  "mypy>=1.10",
  "pandas-stubs",
]

[project.scripts]
idsbench = "idsbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["idsbench"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unused_ignores = true
disallow_untyped_calls = false  # scikit-learn has no type information

[[tool.mypy.overrides]]
module = ["sklearn.*", "matplotlib.*", "scipy.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/*" = ["E501"]
"tests/*" = ["E501"]
"tools/*" = ["E501"]
